services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: fluxora
      POSTGRES_PASSWORD: fluxora
      POSTGRES_DB: fluxora
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fluxora -d fluxora"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data

  minio:
    image: ghcr.io/coollabsio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: fluxora
      MINIO_ROOT_PASSWORD: fluxora-local-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  api:
    image: fluxora-api
    build:
      context: ./backend
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://fluxora:fluxora@postgres:5432/fluxora
      DATABASE_CONNECT_TIMEOUT_SECONDS: "5"
      # Names without a key can be listed here. Addresses and keys come from model-endpoints.yaml.
      MODEL_SECRET_REFS: qianwen,local_model_secret,wan_video
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: fluxora
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: fluxora
      S3_SECRET_ACCESS_KEY: fluxora-local-secret
      REDIS_URL: redis://redis:6379/0
      SYSTEM_DEFAULTS_FILE: /config/system-defaults.json
      LOG_DIR: /var/log/fluxora
      LOG_SERVICE: api
    env_file:
      - path: .env
        required: false
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    extra_hosts:
      - "minio:host-gateway"
    volumes:
      - ./backend:/app
      - ./config/system-defaults.json:/config/system-defaults.json:ro
      - ./logs:/var/log/fluxora
    command:
      - sh
      - -c
      - alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  text-worker:
    image: fluxora-api
    build:
      context: ./backend
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://fluxora:fluxora@postgres:5432/fluxora
      DATABASE_CONNECT_TIMEOUT_SECONDS: "5"
      MODEL_SECRET_REFS: qianwen,local_model_secret,wan_video
      # Creative chat submits image tasks through the same storage configuration.
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: fluxora
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: fluxora
      S3_SECRET_ACCESS_KEY: fluxora-local-secret
      LOG_DIR: /var/log/fluxora
      LOG_SERVICE: text-worker
    env_file:
      - path: .env
        required: false
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./logs:/var/log/fluxora
    command:
      - python
      - -m
      - app.workers.text_completion
    restart: unless-stopped

  image-worker:
    image: fluxora-api
    build:
      context: ./backend
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://fluxora:fluxora@postgres:5432/fluxora
      DATABASE_CONNECT_TIMEOUT_SECONDS: "5"
      MODEL_SECRET_REFS: qianwen,local_model_secret,wan_video
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: fluxora
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: fluxora
      S3_SECRET_ACCESS_KEY: fluxora-local-secret
      REDIS_URL: redis://redis:6379/0
      SYSTEM_DEFAULTS_FILE: /config/system-defaults.json
      LOG_DIR: /var/log/fluxora
      LOG_SERVICE: image-worker
    env_file:
      - path: .env
        required: false
    depends_on:
      api:
        condition: service_healthy
      minio:
        condition: service_started
      redis:
        condition: service_started
    extra_hosts:
      - "minio:host-gateway"
    volumes:
      - ./backend:/app
      - ./config/system-defaults.json:/config/system-defaults.json:ro
      - ./logs:/var/log/fluxora
    command:
      - python
      - -m
      - app.workers.image_generation
    restart: unless-stopped

  video-worker:
    image: fluxora-api
    build:
      context: ./backend
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://fluxora:fluxora@postgres:5432/fluxora
      DATABASE_CONNECT_TIMEOUT_SECONDS: "5"
      MODEL_SECRET_REFS: qianwen,local_model_secret,wan_video
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: fluxora
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: fluxora
      S3_SECRET_ACCESS_KEY: fluxora-local-secret
      REDIS_URL: redis://redis:6379/0
      SYSTEM_DEFAULTS_FILE: /config/system-defaults.json
      LOG_DIR: /var/log/fluxora
      LOG_SERVICE: video-worker
    env_file:
      - path: .env
        required: false
    depends_on:
      api:
        condition: service_healthy
      minio:
        condition: service_started
      redis:
        condition: service_started
    extra_hosts:
      - "minio:host-gateway"
    volumes:
      - ./backend:/app
      - ./config/system-defaults.json:/config/system-defaults.json:ro
      - ./logs:/var/log/fluxora
    command:
      - python
      - -m
      - app.workers.video_generation
    restart: unless-stopped

  editor-worker:
    image: fluxora-api
    build:
      context: ./backend
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://fluxora:fluxora@postgres:5432/fluxora
      DATABASE_CONNECT_TIMEOUT_SECONDS: "5"
      MODEL_SECRET_REFS: qianwen,local_model_secret,wan_video
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: fluxora
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: fluxora
      S3_SECRET_ACCESS_KEY: fluxora-local-secret
      LOG_DIR: /var/log/fluxora
      LOG_SERVICE: editor-worker
    env_file:
      - path: .env
        required: false
    depends_on:
      api:
        condition: service_healthy
      minio:
        condition: service_started
    extra_hosts:
      - "minio:host-gateway"
    volumes:
      - ./backend:/app
      - ./logs:/var/log/fluxora
    command:
      - python
      - -m
      - app.workers.editor_render
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: development
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  elasticsearch_data:
  minio_data:
  postgres_data:
  frontend_node_modules:
