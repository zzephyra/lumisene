name: ci

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fluxora
          POSTGRES_PASSWORD: fluxora
          POSTGRES_DB: fluxora
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fluxora -d fluxora"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check deployment orchestration
        run: python -m unittest discover -s scripts/tests -v
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/0.8.15/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install video test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version
          ffprobe -version
      - name: Run pytest
        working-directory: backend
        run: |
          uv sync --frozen --group dev
          uv run pytest

  images:
    needs: pytest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_prefix: ${{ steps.names.outputs.prefix }}
    steps:
      - uses: actions/checkout@v4
      - name: Image names
        id: names
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          platforms: linux/amd64
          tags: ${{ steps.names.outputs.prefix }}-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          target: production
          push: true
          platforms: linux/amd64
          tags: ${{ steps.names.outputs.prefix }}-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    needs: images
    permissions:
      contents: read
      packages: read
    concurrency:
      group: tencent-production
      cancel-in-progress: false
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Update Tencent Cloud
        env:
          SSH_KEY: ${{ secrets.TENCENT_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.TENCENT_SSH_KNOWN_HOSTS }}
          HOST: ${{ secrets.TENCENT_HOST }}
          DEPLOY_USER: ${{ secrets.TENCENT_USER }}
          PORT: ${{ secrets.TENCENT_SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.TENCENT_DEPLOY_PATH }}
          GITHUB_SHA: ${{ github.sha }}
          IMAGE_PREFIX: ${{ needs.images.outputs.image_prefix }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS" && test -n "$HOST" && test -n "$DEPLOY_USER" && test -n "$DEPLOY_PATH"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          port="${PORT:-22}"
          quoted_path="$(printf '%q' "$DEPLOY_PATH")"
          quoted_sha="$(printf '%q' "$GITHUB_SHA")"
          quoted_prefix="$(printf '%q' "$IMAGE_PREFIX")"
          quoted_registry_user="$(printf '%q' "$REGISTRY_USER")"
          printf '%s' "$REGISTRY_TOKEN" | ssh -i ~/.ssh/id_ed25519 \
            -p "$port" \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$HOST" \
            "set -eu; cd $quoted_path; git fetch origin $quoted_sha; git checkout --detach $quoted_sha; bash scripts/deploy-tencent.sh $quoted_prefix $quoted_sha $quoted_registry_user"
