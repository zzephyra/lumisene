name: ci

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fluxora
          POSTGRES_PASSWORD: fluxora
          POSTGRES_DB: fluxora
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fluxora -d fluxora"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check deployment orchestration
        run: python -m unittest discover -s scripts/tests -v
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/0.8.15/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install video test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version
          ffprobe -version
      - name: Run pytest
        working-directory: backend
        run: |
          uv sync --frozen --group dev
          uv run pytest

  images:
    needs: pytest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_prefix: ${{ steps.names.outputs.prefix }}
    steps:
      - uses: actions/checkout@v4
      - name: Image names
        id: names
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          platforms: linux/amd64
          tags: ${{ steps.names.outputs.prefix }}-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          target: production
          push: true
          platforms: linux/amd64
          tags: ${{ steps.names.outputs.prefix }}-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    needs: images
    permissions:
      contents: read
      packages: read
    concurrency:
      group: tencent-production
      cancel-in-progress: false
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Update Tencent Cloud
        env:
          SSH_KEY: ${{ secrets.TENCENT_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.TENCENT_SSH_KNOWN_HOSTS }}
          HOST: ${{ secrets.TENCENT_HOST }}
          DEPLOY_USER: ${{ secrets.TENCENT_USER }}
          PORT: ${{ secrets.TENCENT_SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.TENCENT_DEPLOY_PATH }}
          GITHUB_SHA: ${{ github.sha }}
          IMAGE_PREFIX: ${{ needs.images.outputs.image_prefix }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS" && test -n "$HOST" && test -n "$DEPLOY_USER" && test -n "$DEPLOY_PATH"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          port="${PORT:-22}"
          quoted_path="$(printf '%q' "$DEPLOY_PATH")"
          quoted_sha="$(printf '%q' "$GITHUB_SHA")"
          quoted_prefix="$(printf '%q' "$IMAGE_PREFIX")"
          quoted_registry_user="$(printf '%q' "$REGISTRY_USER")"
          ssh_cmd() {
            ssh -i ~/.ssh/id_ed25519 \
              -p "$port" \
              -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=20 \
              -o ServerAliveInterval=15 \
              -o ServerAliveCountMax=8 \
              "$DEPLOY_USER@$HOST" \
              "$@"
          }
          # The registry token is consumed into a mode-600 file. The deploy process
          # is detached so a later SSH reset does not kill an in-progress image pull.
          printf '%s' "$REGISTRY_TOKEN" | ssh_cmd \
            "set -eu; umask 077; token_file=\$(mktemp); cat > \"\$token_file\"; cd $quoted_path; git fetch origin $quoted_sha; git checkout --detach $quoted_sha; mkdir -p logs; if [ -f logs/deploy.pid ] && kill -0 \"\$(cat logs/deploy.pid)\" 2>/dev/null; then rm -f \"\$token_file\"; echo already-running; exit 0; fi; rm -f logs/deploy.exit; nohup bash -c 'bash scripts/deploy-tencent.sh \"\$1\" \"\$2\" \"\$3\" < \"\$4\"; code=\$?; rm -f \"\$4\"; echo \"\$code\" > logs/deploy.exit' bash $quoted_prefix $quoted_sha $quoted_registry_user \"\$token_file\" >> logs/deploy.log 2>&1 & echo \$! > logs/deploy.pid"
          for _ in $(seq 1 120); do
            if ! state="$(ssh_cmd "cd $quoted_path; if [ -f logs/deploy.exit ]; then cat logs/deploy.exit; else echo RUNNING; fi")"; then
              echo "SSH to the server failed; the detached deploy keeps running." >&2
              sleep 30
              continue
            fi
            if [ "$state" = "0" ]; then
              ssh_cmd "cd $quoted_path; tail -n 40 logs/deploy.log" || true
              exit 0
            fi
            if [ "$state" != "RUNNING" ]; then
              ssh_cmd "cd $quoted_path; tail -n 80 logs/deploy.log" || true
              echo "Deployment failed with exit $state." >&2
              exit 1
            fi
            ssh_cmd "cd $quoted_path; tail -n 5 logs/deploy.log" || true
            sleep 30
          done
          echo "Deployment did not finish within 60 minutes." >&2
          exit 1
