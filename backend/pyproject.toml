[project]
name = "fluxora-backend"
version = "0.1.0"
description = "Lumi creative workspace API and workers by Lumisene"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "argon2-cffi>=23.1.0",
    "asyncpg>=0.30",
    "fastapi>=0.115",
    "langchain-deepseek>=1.0,<2",
    "pillow>=11.0",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0.3",
    "qiniu>=7.15",
    "sqlalchemy[asyncio]>=2.0.36",
    "structlog>=24.4",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
